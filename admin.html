<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin · Stop Bloxham Flooding</title><link rel="stylesheet" href="styles.css"></head><body>
<header><div class="wrap nav"><a class="brand" href="index.html">STOP BLOXHAM FLOODING</a><nav><a href="index.html">Public site</a></nav></div></header>
<main class="wrap admin-page"><div id="loginBox" class="card"><h1>Administrator login</h1><form id="loginForm" class="form"><input name="email" type="email" required placeholder="Admin email"><input name="password" type="password" required placeholder="Password"><button class="btn">Sign in</button><p id="loginMessage" class="muted"></p></form></div>
<div id="dashboard" hidden><div class="admin-head"><div><p class="kicker">Private area</p><h1>Site administration</h1></div><button id="signOut" class="btn">Sign out</button></div>
<div class="adminnav"><button data-tab="content">Content</button><button data-tab="projects">Projects</button><button data-tab="questions">Questions</button><button data-tab="documents">Documents</button></div>
<section id="contentTab" class="admin-tab"><div class="card"><h2>Site content</h2><form id="contentForm" class="form"><input name="status" placeholder="Overall status"><input name="updated" placeholder="Latest update"><input name="focus" placeholder="Current focus"><textarea name="intro" placeholder="Homepage introduction"></textarea><textarea name="latest" placeholder="Latest update text"></textarea><button class="btn">Save content</button><p class="muted" id="contentMessage"></p></form></div></section>
<section id="projectsTab" class="admin-tab" hidden><div class="card"><h2>Projects</h2><form id="projectForm" class="form"><input name="title" required placeholder="Project title"><input name="icon" placeholder="Icon, e.g. 🌿"><textarea name="description" required placeholder="Description"></textarea><input name="sort_order" type="number" value="1"><button class="btn">Add project</button></form><div id="projectList"></div></div></section>
<section id="questionsTab" class="admin-tab" hidden><div class="card"><h2>Resident submissions</h2><div id="questionList"></div></div></section>
<section id="documentsTab" class="admin-tab" hidden><div class="card"><h2>Documents</h2><form id="documentForm" class="form"><input name="title" required placeholder="Document title"><input name="url" type="url" required placeholder="https://…"><button class="btn">Add document</button></form><div id="documentList"></div></div></section>
</div></main><script type="module" src="admin.js"></script></body></html>
